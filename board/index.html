<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライブ用ボード</title>
<!--
  ライブ用ボード（正本ゴール ba1a58bb-9f46-4bf8-9e0d-4a664d37e4d5 / 子 1d9b1b4d-39bb-49f2-84fe-cea8815df8ff）
  ライバーが自分の画面に「いま何をやっているか」を置く札。中継機には何も足さない。
  - 右上の縦のボタン：📌最前面（解除）・＋文字・🎨背景・💾保存・↻更新。マウスがボードの上にある時だけ出る（2026-11-09 上の帯が文字にかぶって邪魔なのでやめた）
  - 「＋文字」で文字ボックスを足す。ボックスを押すと選ばれ、右下の角をつまんで動かすと文字の大きさが変わる。ボックスはドラッグで動かす
  - 選ぶと、そのすぐ上（上が詰まっていれば下）に小さな道具が出る：大きさ −／＋、太字、下線、文字色、複製、削除（2026-11-09 Canva風に。ゴール 0c03a57b）
  - ダブルクリック（または選んだボックスをもう一度押す）で書き換え。全文が選ばれた状態で入るので、そのまま打てば置き換わる。消すのは道具の🗑か Delete キー
  - 「最前面」で Chrome / Edge の小窓（Document Picture-in-Picture）を開き、その中にこのページを ?pip=1 で読み込む（iframe）。
    小窓の中の「↻更新」は中のページだけ読み直すので、小窓の位置と大きさはそのまま（2026-11-09）
  - 太字・下線は、書き換え中に文字の一部を選んで押せばその部分だけ、選ばずに押せばボックス全体（2026-11-09）
  - 💾保存：今のボードを①〜③に保存し、あとで読み込める。ライバーごとに自分のパソコンのブラウザに残る（2026-11-09）
  - 色の見本の紺はアドネスのロゴの色 #141071（2026-11-09）
  - 中身はこのブラウザ（localStorage）に残る。外には送らない
  - 道具・選んだ枠は、マウスがボードの外にある時は消える（配信に映らないように）
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; background: #222; color: #eee; }
  #board { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg, #1a73e8); }
  /* 右上の縦のボタン */
  #side { position: absolute; right: 6px; top: 6px; z-index: 10; display: flex; flex-direction: column; gap: 4px; align-items: stretch; transition: opacity .15s; }
  #board:not(:hover) #side, #board:not(:hover) .pop { opacity: 0; pointer-events: none; }
  #slotPop { flex-direction: column; align-items: stretch; color: #222; font-size: 12px; }
  #slotPop .row { display: flex; gap: 4px; align-items: center; }
  #slotPop button { font: inherit; color: #222; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #slotPop button:hover { background: #e2e2e2; }
  #slotPop button:disabled { opacity: .35; cursor: default; }
  #slotPop .lb { color: #666; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side button { font: inherit; font-size: 12px; color: #fff; background: rgba(30,30,30,.85); border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
                 padding: 3px 8px; cursor: pointer; white-space: nowrap; text-align: left; }
  #side button:hover { background: rgba(60,60,60,.95); }
  #side button.on { border-color: #fff; }
  .pop { position: absolute; z-index: 10; display: none; gap: 4px; align-items: center; padding: 5px 6px; background: #fff; border-radius: 8px;
         box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .pop.on { display: flex; }
  .sw { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #888; cursor: pointer; padding: 0; }
  input[type=color] { width: 24px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  .sep { width: 1px; height: 20px; background: #555; }
  /* 選んだ文字のすぐ上に出る道具 */
  #tb { position: absolute; z-index: 9; display: none; gap: 4px; align-items: center; padding: 4px 6px; background: #fff; color: #222;
        border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); font-size: 13px; white-space: nowrap; }
  #tb.on { display: flex; }
  #board:not(:hover) #tb { display: none; }
  #tb button { font: inherit; color: #222; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; cursor: pointer; min-width: 26px; }
  #tb button:hover { background: #e2e2e2; }
  #tb button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #tb .sw { width: 18px; height: 18px; border-radius: 50%; }
  #tb .sep { background: #ddd; }
  #tbSize { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
  #msg { position: absolute; left: 8px; bottom: 8px; z-index: 11; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 4px 8px; border-radius: 6px; display: none; }
  .box { position: absolute; padding: .08em .2em; line-height: 1.25; font-weight: 700; white-space: pre; cursor: move; user-select: none;
         outline: none; border: 2px solid transparent; border-radius: 4px; min-width: 1em; }
  .box.sel { border-color: rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .box.edit { cursor: text; user-select: text; border-style: dashed; }
  .box .t { outline: none; display: inline-block; min-width: .5em; }
  .box .h { position: absolute; right: -9px; bottom: -9px; width: 16px; height: 16px; background: #fff; border: 2px solid #1a73e8; border-radius: 3px;
            cursor: nwse-resize; display: none; }
  .box.sel .h { display: block; }
  #board:not(:hover) .box.sel { border-color: transparent; box-shadow: none; }
  #board:not(:hover) .box .h { display: none; }
</style>
</head>
<body>
<div id="board">
  <div id="side">
    <button id="pin" title="ほかのアプリより常に手前の小窓に出す">📌 最前面</button>
    <button id="add" title="文字ボックスを足す">＋ 文字</button>
    <button id="bgBtn" title="ボード全体の背景色">🎨 背景</button>
    <button id="slotBtn" title="今のボードを保存する／保存したボードを読み込む（このパソコンのブラウザに残る）">💾 保存</button>
    <button id="reload" title="ボードを読み直す（小窓の位置と大きさはそのまま）">↻ 更新</button>
  </div>
  <div id="slotPop" class="pop"></div>
  <div id="bgPop" class="pop"><span id="bgSw" style="display:flex;gap:4px"></span><input type="color" id="bgPick" title="ほかの色"></div>
  <div id="tb">
    <button id="minus" title="文字を小さく">−</button><span id="tbSize"></span><button id="plus" title="文字を大きく">＋</button>
    <span class="sep"></span>
    <button id="bold" title="太字／細字"><b>B</b></button><button id="und" title="下線"><u>U</u></button>
    <span class="sep"></span>
    <span id="fgSw" style="display:flex;gap:3px" title="文字の色"></span><input type="color" id="fgPick" title="ほかの色">
    <span class="sep"></span>
    <button id="dup" title="複製">⧉</button>
    <button id="del" title="消す（Deleteキーでも消せる）">🗑</button>
  </div>
  <div id="msg"></div>
</div>
<script>
(() => {
  const KEY = 'addness-live-board-v1';
  const SLOTS = 'addness-live-board-slots-v1';   // 保存①〜③
  const ADDNESS = '#141071';   // アドネスのロゴの紺（addness.com のアイコンから取った色）
  const BG = [ADDNESS, '#1a73e8', '#111111', '#ffffff', '#ffd400', '#e53935', '#2e7d32'];
  const FG = ['#ffffff', ADDNESS, '#111111', '#ffd400', '#e53935', '#1a73e8'];
  const IN_PIP = new URLSearchParams(location.search).has('pip');  // 小窓の中で読み込まれた時
  const $ = id => document.getElementById(id);
  const board = $('board'), side = $('side'), msg = $('msg');
  const bgPick = $('bgPick'), bgPop = $('bgPop'), fgPick = $('fgPick'), tb = $('tb'), tbSize = $('tbSize');
  const boldBtn = $('bold'), undBtn = $('und'), pinBtn = $('pin');
  let state = load();
  let sel = null;   // 選んでいるボックスの要素
  let pipWin = null;
  let onTb = false;  // 道具の上にマウスがあるか
  let editAt = 0;   // 書き換えに入った時刻（ダブルクリックの2打目で全選択が崩れないように使う）

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.boxes)) return s; } catch (e) {}
    return { bg: '#1a73e8', boxes: [{ id: 1, text: 'いまやっていること', x: 24, y: 24, size: 40, color: '#ffffff' }] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function find(el) { return state.boxes.find(b => String(b.id) === el.dataset.id); }
  function say(t) { msg.textContent = t; msg.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => msg.style.display = 'none', 4000); }

  // ---- 色の見本 ----
  function swatches(holder, list, pick, apply) {
    list.forEach(c => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c === ADDNESS ? 'アドネスの色' : c; b.onclick = () => apply(c); holder.appendChild(b); });
    pick.oninput = () => apply(pick.value);
  }
  function setBg(c) { state.bg = c; board.style.setProperty('--bg', c); bgPick.value = c; save(); }
  function setFg(c) {
    fgPick.value = c;
    if (!sel) { state.fg = c; save(); return; }
    const b = find(sel); b.color = c; sel.style.color = c; save();
  }
  swatches($('bgSw'), BG, bgPick, setBg);
  swatches($('fgSw'), FG, fgPick, setFg);
  // 背景ボタン：押すと左に色の見本が出る。もう一度押すか、ボードの何もない所を押すと閉じる
  const slotPop = $('slotPop');
  function closePops() { bgPop.classList.remove('on'); slotPop.classList.remove('on'); }
  function openPop(btn, pop) {
    const was = pop.classList.contains('on'); closePops();
    if (was) return;
    pop.classList.add('on');
    const r = btn.getBoundingClientRect(), br = board.getBoundingClientRect();
    pop.style.top = (r.top - br.top) + 'px';
    pop.style.left = Math.max(4, r.left - br.left - pop.offsetWidth - 6) + 'px';
  }
  $('bgBtn').onclick = () => openPop($('bgBtn'), bgPop);
  [bgPop, slotPop].forEach(p => p.addEventListener('pointerdown', e => e.stopPropagation()));

  // ---- 保存①〜③：今のボードをまるごと残し、あとで読み込む。このパソコンのブラウザにだけ残る ----
  function slots() { try { return JSON.parse(localStorage.getItem(SLOTS)) || {}; } catch (e) { return {}; } }
  function drawSlots() {
    const s = slots(); slotPop.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('b'); name.textContent = '①②③'[n - 1];
      const sv = document.createElement('button'); sv.textContent = '保存';
      const ld = document.createElement('button'); ld.textContent = '読込'; ld.disabled = !s[n];
      const lb = document.createElement('span'); lb.className = 'lb';
      lb.textContent = s[n] ? (s[n].label || '（文字なし）') : '空き';
      sv.onclick = () => {
        if (sel) stopEdit(sel);
        const all = slots(), first = state.boxes[0];
        all[n] = { state: JSON.parse(JSON.stringify(state)), label: first ? first.text.split('\n')[0].slice(0, 20) : '' };
        try { localStorage.setItem(SLOTS, JSON.stringify(all)); say('「' + '①②③'[n - 1] + '」に保存しました'); } catch (e) { say('保存できませんでした'); }
        drawSlots();
      };
      ld.onclick = () => {
        const one = slots()[n]; if (!one) return;
        state = JSON.parse(JSON.stringify(one.state)); save(); reloadState(); closePops();
        say('「' + '①②③'[n - 1] + '」を読み込みました');
      };
      row.append(name, sv, ld, lb); slotPop.appendChild(row);
    });
  }
  $('slotBtn').onclick = () => { drawSlots(); openPop($('slotBtn'), slotPop); };

  // ---- ボックス ----
  function look(el, b) {
    el.style.left = b.x + 'px'; el.style.top = b.y + 'px'; el.style.fontSize = b.size + 'px'; el.style.color = b.color;
    el.style.fontWeight = b.bold === false ? '400' : '700';   // 前からあるボックスは太字のまま
    // 文字の span は inline-block なので、下線は外の箱ではなく span に付ける（外に付けても届かない）
    el.querySelector('.t').style.textDecoration = b.underline ? 'underline' : 'none';
  }
  function render(b) {
    const el = document.createElement('div');
    el.className = 'box'; el.dataset.id = b.id;
    const t = document.createElement('span'); t.className = 't';
    if (b.html) t.innerHTML = clean(b.html); else t.textContent = b.text;
    el.appendChild(t);
    look(el, b);
    const h = document.createElement('span'); h.className = 'h'; el.appendChild(h);
    board.appendChild(el);
    bind(el, h);
    return el;
  }

  function select(el) {
    if (sel && sel !== el) stopEdit(sel);
    board.querySelectorAll('.box.sel').forEach(x => x !== el && x.classList.remove('sel'));
    sel = el;
    if (el) { el.classList.add('sel'); fgPick.value = find(el).color; }
    placeTb();
  }
  // 選んだ文字のすぐ上に道具を出す。上が詰まっていれば下に出す
  function placeTb() {
    if (!sel || !sel.isConnected) { tb.classList.remove('on'); return; }
    const b = find(sel); if (!b) { tb.classList.remove('on'); return; }
    tbSize.textContent = b.size;
    boldBtn.classList.toggle('on', b.bold !== false);
    undBtn.classList.toggle('on', !!b.underline);
    // 道具の上にマウスがある間は動かさない（＋を続けて押した時にボタンが逃げないように）。離れたら直す
    if (onTb && tb.classList.contains('on')) return;
    tb.classList.add('on');
    const w = tb.offsetWidth, hh = tb.offsetHeight, W = board.clientWidth;
    let x = Math.max(4, Math.min(b.x, W - w - 4));
    let y = b.y - hh - 8;
    if (y < 4) y = b.y + sel.offsetHeight + 8;
    tb.style.left = x + 'px'; tb.style.top = y + 'px';
  }
  function setSize(el, size) {
    const b = find(el); b.size = Math.round(Math.min(400, Math.max(10, size))); el.style.fontSize = b.size + 'px';
  }
  function startEdit(el) {
    const t = el.querySelector('.t');
    editAt = Date.now();
    // 一部だけ太字・下線にできるよう、飾りを持てる書き方にする（貼り付けと改行は下で文字だけにしている）
    el.classList.add('edit'); t.contentEditable = 'true';
    t.focus();
    // 書き換えに入ったら全文を選んでおく（そのまま打てば置き換わる）
    const doc = el.ownerDocument, r = doc.createRange(); r.selectNodeContents(t);
    const s = doc.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function stopEdit(el) {
    if (!el.classList.contains('edit')) return;
    const t = el.querySelector('.t');
    el.classList.remove('edit'); t.contentEditable = 'false';
    const b = find(el); if (!b) return;
    b.text = t.innerText.replace(/\n$/, '');
    b.html = clean(t.innerHTML);
    save();
  }
  // 残す飾りは 太字・下線・改行だけ。それ以外のタグや書式は外して文字だけにする
  function clean(html) {
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    const out = document.createElement('div');
    (function walk(src, dst) {
      src.childNodes.forEach(n => {
        if (n.nodeType === 3) { dst.appendChild(document.createTextNode(n.nodeValue)); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName;
        if (tag === 'BR') { dst.appendChild(document.createElement('br')); return; }
        // 太字のボックスで一部を細字にすると、ブラウザは style="font-weight: normal" を付ける。その2つの書式だけは残す
        const fw = n.style ? n.style.fontWeight : '', td = n.style ? (n.style.textDecorationLine || '') : '';
        let x = null;
        if (tag === 'B' || tag === 'STRONG') x = document.createElement('b');
        else if (tag === 'U') x = document.createElement('u');
        else if (tag === 'SPAN' && (fw || td)) x = document.createElement('span');
        if (x) { if (fw) x.style.fontWeight = fw; if (td) x.style.textDecorationLine = td; }
        if (tag === 'DIV' || tag === 'P') { if (dst.childNodes.length) dst.appendChild(document.createElement('br')); }
        walk(n, x || dst); if (x) dst.appendChild(x);
      });
    })(tpl.content, out);
    return out.innerHTML;
  }

  function bind(el, h) {
    // 右下の角：つまんで動かすと文字の大きさが変わる
    h.addEventListener('pointerdown', e => {
      e.stopPropagation(); e.preventDefault(); h.setPointerCapture(e.pointerId);
      const b = find(el), sx = e.clientX, sy = e.clientY, w0 = el.offsetWidth, h0 = el.offsetHeight, s0 = b.size;
      const mv = ev => {
        const k = Math.max((w0 + ev.clientX - sx) / w0, (h0 + ev.clientY - sy) / h0);
        setSize(el, s0 * k); placeTb();
      };
      const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); save(); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
    });
    // 本体：押すと選ぶ／ドラッグで動かす／選んでいる時にもう一度押すと書き換え
    el.addEventListener('pointerdown', e => {
      if (el.classList.contains('edit')) return;
      e.stopPropagation(); closePops();
      const was = sel === el; select(el);
      const b = find(el), sx = e.clientX, sy = e.clientY, x0 = b.x, y0 = b.y; let moved = false;
      el.setPointerCapture(e.pointerId);
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        moved = true; b.x = Math.round(x0 + dx); b.y = Math.round(y0 + dy); el.style.left = b.x + 'px'; el.style.top = b.y + 'px'; placeTb();
      };
      const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); if (moved) save(); else if (was) startEdit(el); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
    });
    el.querySelector('.t').addEventListener('blur', () => stopEdit(el));
    el.querySelector('.t').addEventListener('input', placeTb);
    // 改行は改行だけ、貼り付けは文字だけ（よそのページの書式を持ち込まない）
    el.querySelector('.t').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); el.ownerDocument.execCommand('insertLineBreak'); }
    });
    el.querySelector('.t').addEventListener('paste', e => {
      e.preventDefault(); el.ownerDocument.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
    });
    // ダブルクリックで書き換え。2打目でブラウザが単語だけ選び直すので、入った直後なら全文を選び直す
    el.addEventListener('dblclick', () => {
      if (!el.classList.contains('edit')) { select(el); startEdit(el); return; }
      if (Date.now() - editAt < 700) {
        const t = el.querySelector('.t'), doc = el.ownerDocument, r = doc.createRange(); r.selectNodeContents(t);
        const s = doc.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
    });
  }

  board.addEventListener('pointerdown', e => { if (e.target === board) { select(null); closePops(); } });
  side.addEventListener('pointerdown', e => e.stopPropagation());
  // 書いている文字が端からはみ出すとボードごとずれて見えるので、ずれは戻す
  board.addEventListener('scroll', () => { board.scrollLeft = 0; board.scrollTop = 0; });

  $('add').onclick = () => {
    const id = Date.now(), n = state.boxes.length % 5;
    const b = { id, text: '新しい文字', x: 24 + n * 20, y: 24 + n * 20, size: 32, color: state.fg || '#ffffff', bold: true, underline: false };
    state.boxes.push(b); save();
    const el = render(b); select(el); startEdit(el);
  };
  function removeSel() {
    if (!sel) return;
    state.boxes = state.boxes.filter(b => String(b.id) !== sel.dataset.id); sel.remove(); sel = null; save(); placeTb();
  }
  // 太字・下線：押すたびに入れる／外す
  // 書き換え中に文字の一部を選んでいれば、その部分だけ。選んでいなければボックス全体
  function toggle(key, def) {
    if (!sel) return;
    const t = sel.querySelector('.t'), doc = sel.ownerDocument, s = doc.getSelection();
    if (sel.classList.contains('edit') && s.rangeCount && !s.isCollapsed && t.contains(s.getRangeAt(0).commonAncestorContainer)) {
      doc.execCommand(key === 'bold' ? 'bold' : 'underline');
      const b = find(sel); b.html = clean(t.innerHTML); save(); placeTb();
      return;
    }
    const b = find(sel); b[key] = !(b[key] === undefined ? def : b[key]);
    look(sel, b); save(); placeTb();
  }
  boldBtn.onclick = () => toggle('bold', true);
  undBtn.onclick = () => toggle('underline', false);
  $('del').onclick = removeSel;
  $('minus').onclick = () => { if (!sel) return; setSize(sel, find(sel).size - 4); save(); placeTb(); };
  $('plus').onclick = () => { if (!sel) return; setSize(sel, find(sel).size + 4); save(); placeTb(); };
  $('dup').onclick = () => {
    if (!sel) return;
    stopEdit(sel);
    const b = { ...find(sel), id: Date.now() }; b.x += 20; b.y += 20;
    state.boxes.push(b); save();
    select(render(b));
  };
  // 道具を押しても、ボードの何もない所を押した扱い（選択が外れる）にしない
  tb.addEventListener('pointerdown', e => e.stopPropagation());
  // 道具のボタンを押しても、書き換え中の文字の選択が外れないように（色の入力欄だけは普通に開く）
  tb.addEventListener('mousedown', e => { if (e.target.tagName !== 'INPUT') e.preventDefault(); });
  tb.addEventListener('pointerenter', () => { onTb = true; });
  tb.addEventListener('pointerleave', () => { onTb = false; placeTb(); });
  window.addEventListener('resize', placeTb);
  document.addEventListener('keydown', e => {
    if (!sel) return;
    if (sel.classList.contains('edit')) { if (e.key === 'Escape') { stopEdit(sel); } return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSel(); }
  });

  // ---- 更新：このページだけ読み直す（小窓の中なら、小窓は閉じずにそのまま） ----
  // 末尾に時刻を付けて、前に読み込んだ古い版を使わないようにする
  $('reload').onclick = () => {
    if (sel) stopEdit(sel);
    location.replace(location.pathname + (IN_PIP ? '?pip=1&t=' : '?t=') + Date.now());
  };

  // ---- 最前面（Document Picture-in-Picture） ----
  // 小窓の中には、このページを ?pip=1 で読み込む。中で「更新」しても小窓は残る
  function reloadState() {
    board.querySelectorAll('.box').forEach(x => x.remove()); sel = null;
    state = load(); setBg(state.bg); state.boxes.forEach(render); placeTb();
  }
  if (IN_PIP) {
    pinBtn.textContent = '📌 最前面を解除'; pinBtn.classList.add('on');
    pinBtn.onclick = () => { if (sel) stopEdit(sel); window.parent.close(); };
    window.focus();   // 小窓を開いてすぐの1回目の操作から、このページに文字が入るように
  } else {
    pinBtn.onclick = async () => {
      if (pipWin) { pipWin.close(); return; }
      if (!('documentPictureInPicture' in window)) { say('この機能は Chrome か Edge（パソコン版）で使えます'); return; }
      if (sel) stopEdit(sel);
      try {
        pipWin = await documentPictureInPicture.requestWindow({ width: Math.max(320, board.offsetWidth >> 1), height: Math.max(180, board.offsetHeight >> 1) });
      } catch (e) { say('小窓を開けませんでした：' + e.message); return; }
      const d = pipWin.document;
      d.title = 'ライブ用ボード';
      const st = d.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;background:#222}iframe{display:block;border:0;width:100%;height:100%}';
      d.head.appendChild(st);
      const f = d.createElement('iframe');
      f.src = location.origin + location.pathname + '?pip=1&t=' + Date.now();
      d.body.appendChild(f);
      board.style.display = 'none'; showHome(true);
      pipWin.addEventListener('pagehide', () => {
        pipWin = null; board.style.display = ''; showHome(false);
        reloadState();   // 小窓の中で変えた分を読み直す
      });
    };
  }
  // 小窓に出ている間、元のタブには案内だけ出す
  const home = document.createElement('div');
  home.style.cssText = 'display:none;padding:24px;font-size:15px;line-height:1.8';
  home.innerHTML = 'ボードは最前面の小窓に出ています。<br>小窓を閉じるか「最前面を解除」を押すと、ここに戻ります。';
  document.body.appendChild(home);
  function showHome(on) { home.style.display = on ? 'block' : 'none'; }

  // ---- 起動 ----
  setBg(state.bg);
  state.boxes.forEach(render);
  fgPick.value = state.fg || '#ffffff';
})();
</script>
</body>
</html>
