<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライブ用ボード</title>
<!--
  ライブ用ボード（正本ゴール ba1a58bb-9f46-4bf8-9e0d-4a664d37e4d5 / 子 1d9b1b4d-39bb-49f2-84fe-cea8815df8ff）
  ライバーが自分の画面に「いま何をやっているか」を置く札。中継機には何も足さない。
  - 右のボタンは触る頻度で3つに分ける（2026-11-09 高見澤さんと決定）。マウスがボードの上にある時だけ出る
    右上「作る」＝＋文字を入れる・背景色（白地で目立たせる）／その下「残す」＝保存・読込／右下の隅に薄く小さく＝最前面を解除・↻更新（窓の操作でほぼ触らない）
  - 「＋文字」で文字ボックスを足す。ボックスを押すと選ばれ、右下の角をつまんで動かすと文字の大きさが変わる。ボックスはドラッグで動かす
  - 選ぶと、そのすぐ上（上が詰まっていれば下）に小さな道具が出る：大きさ −／＋、太字、下線、文字色、複製、削除（2026-11-09 Canva風に。ゴール 0c03a57b）
  - ダブルクリック（または選んだボックスをもう一度押す）で書き換え。全文が選ばれた状態で入るので、そのまま打てば置き換わる。消すのは道具の🗑か Delete キー
  - 「最前面」で Chrome / Edge の小窓（Document Picture-in-Picture）を開き、その中にこのページを ?pip=1 で読み込む（iframe）。
    小窓の中の「↻更新」は中のページだけ読み直すので、小窓の位置と大きさはそのまま（2026-11-09）
  - 太字・下線は、書き換え中に文字の一部を選んで押せばその部分だけ、選ばずに押せばボックス全体（2026-11-09）
  - 💾保存：今のボードを①〜③に保存し、あとで読み込める。ライバーごとに自分のパソコンのブラウザに残る（2026-11-09）
  - 色の見本の紺はアドネスのロゴの色 #141071（2026-11-09）
  - 背景の見せ方：一色／グラデ／動くグラデ／ドットを「背景色」の中で選ぶ。2色目は選んだ色から明るさを変えて自動で作る（2026-11-09）
  - 文字の動き：道具の「動き」から 光る・脈打つ・跳ねる・下線・波 を選ぶ。太字と同じく、一部を選んでいればその部分だけ、選ばなければボックス全体。同じものをもう一度押すか「なし」で外れる（2026-11-09）
    波は表示する時だけ1文字ずつの span に分け、書き換え中と保存の時は元の文字に戻す
  - まとめて選ぶ：何もない所からドラッグして枠に触れたボックス／Shift＋クリックで足す・外す／⌘Aで全部。
    まとめたまま動かす・道具（大きさ±・太字・下線・色・動き・複製・削除）をまとめてかける。
    大きさは、範囲の右下のつまみ・±のどちらも、並び（間隔）ごと拡大・縮小する（2026-11-09 高見澤さん「位置関係が固定だと拡大縮小になっていない」）
    太字・下線・動きは、1つでもかかっていなければ全部にかけ、全部にかかっていれば全部から外す（2026-11-09）
  - ⌘Z で1つ戻す、⌘⇧Z（または ⌘Y）でやり直す。書き換え中の文字の中ではブラウザの普通の取り消しが効く（2026-11-09）
  - 中身はこのブラウザ（localStorage）に残る。外には送らない
  - 道具・選んだ枠は、マウスがボードの外にある時は消える（配信に映らないように）
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; background: #222; color: #eee; }
  #board { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg, #1a73e8); }
  /* 右上の縦のボタン（作る・残す）と、右下の隅の窓の操作 */
  #side .lab { font-size: 11px; color: rgba(255,255,255,.85); text-shadow: 0 0 3px rgba(0,0,0,.6); text-align: right; }
  #side .lab + button { margin-top: 0; }
  #side .gap { height: 8px; }
  #side button.main { background: #fff; color: #141071; border-color: #fff; font-weight: 700; }
  #side button.main:hover { background: #e8eaf6; }
  #win { position: absolute; right: 6px; bottom: 6px; z-index: 10; display: flex; gap: 4px; transition: opacity .15s; }
  #board:not(:hover) #win { opacity: 0; pointer-events: none; }
  #win button { font: inherit; font-size: 11px; color: #fff; background: rgba(30,30,30,.55); border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
  #win button:hover { background: rgba(60,60,60,.9); }
  #side { position: absolute; right: 6px; top: 6px; z-index: 10; display: flex; flex-direction: column; gap: 4px; align-items: stretch; transition: opacity .15s; }
  #board:not(:hover) #side, #board:not(:hover) .pop { opacity: 0; pointer-events: none; }
  #slotPop { flex-direction: column; align-items: stretch; color: #222; font-size: 12px; }
  #slotPop .row { display: flex; gap: 4px; align-items: center; }
  #slotPop button { font: inherit; color: #222; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #slotPop button:hover { background: #e2e2e2; }
  #slotPop button:disabled { opacity: .35; cursor: default; }
  #slotPop .lb { color: #666; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side button { font: inherit; font-size: 12px; color: #fff; background: rgba(30,30,30,.85); border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
                 padding: 3px 8px; cursor: pointer; white-space: nowrap; text-align: left; }
  #side button:hover { background: rgba(60,60,60,.95); }
  #side button.on { border-color: #fff; }
  .pop { position: absolute; z-index: 10; display: none; gap: 4px; align-items: center; padding: 5px 6px; background: #fff; border-radius: 8px;
         box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .pop.on { display: flex; }
  .sw { width: 20px; height: 20px; border-radius: 4px; border: 1px solid #888; cursor: pointer; padding: 0; }
  input[type=color] { width: 24px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  .sep { width: 1px; height: 20px; background: #555; }
  /* 選んだ文字のすぐ上に出る道具 */
  #tb { position: absolute; z-index: 9; display: none; gap: 4px; align-items: center; padding: 4px 6px; background: #fff; color: #222;
        border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); font-size: 13px; white-space: nowrap; }
  #tb.on { display: flex; }
  #board:not(:hover) #tb { display: none; }
  #tb button { font: inherit; color: #222; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; cursor: pointer; min-width: 26px; }
  #tb button:hover { background: #e2e2e2; }
  #tb button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  #tb .sw { width: 18px; height: 18px; border-radius: 50%; }
  #tb .sep { background: #ddd; }
  #tbSize { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
  #msg { position: absolute; left: 8px; bottom: 8px; z-index: 11; font-size: 12px; background: rgba(0,0,0,.75); color: #fff; padding: 4px 8px; border-radius: 6px; display: none; }
  .box { position: absolute; padding: .08em .2em; line-height: 1.25; font-weight: 700; white-space: pre; cursor: move; user-select: none;
         outline: none; border: 2px solid transparent; border-radius: 4px; min-width: 1em; }
  .box.sel { border-color: rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .box.edit { cursor: text; user-select: text; border-style: dashed; }
  .box .t { outline: none; display: inline-block; min-width: .5em; }
  .box .h { position: absolute; right: -9px; bottom: -9px; width: 16px; height: 16px; background: #fff; border: 2px solid #1a73e8; border-radius: 3px;
            cursor: nwse-resize; display: none; }
  .box.sel .h { display: block; }
  #board:not(:hover) .box.sel { border-color: transparent; box-shadow: none; }
  #board:not(:hover) .box .h { display: none; }
  /* まとめて選んでいる時は、1つずつの角のつまみの代わりに、全部を囲む範囲の右下に1つ出す */
  #board.multi .box .h { display: none; }
  #gh { position: absolute; z-index: 9; width: 16px; height: 16px; background: #fff; border: 2px solid #1a73e8; border-radius: 3px; cursor: nwse-resize; display: none; }
  #board.multi #gh { display: block; }
  #board:not(:hover) #gh { display: none; }
  #mq { position: absolute; z-index: 8; border: 1px dashed #fff; background: rgba(255,255,255,.12); pointer-events: none; display: none; }
  /* 背景の見せ方 */
  #board.st-grad { background-image: linear-gradient(135deg, var(--bg), var(--bg2)); }
  #board.st-flow { background-image: linear-gradient(120deg, var(--bg), var(--bg2), var(--bg3), var(--bg)); background-size: 300% 300%; animation: bgFlow 12s ease-in-out infinite alternate; }
  #board.st-dot { background-image: radial-gradient(var(--dot) 1.3px, transparent 1.5px); background-size: 16px 16px; }
  @keyframes bgFlow { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  #bgPop { flex-direction: column; align-items: stretch; }
  #bgPop .row { display: flex; gap: 4px; align-items: center; }
  #bgSt button, #fxRow button { font: inherit; font-size: 12px; color: #222; background: #f1f1f1; border: 1px solid #ccc; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  #bgSt button:hover, #fxRow button:hover { background: #e2e2e2; }
  #bgSt button.on, #fxRow button.on { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  /* 文字の動き（道具の「動き」から） */
  #fxRow { position: absolute; left: 0; top: calc(100% + 4px); display: none; gap: 4px; padding: 4px 6px; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  #fxRow.on { display: flex; }
  .fx-shine { background-image: linear-gradient(100deg, var(--c) 40%, color-mix(in srgb, var(--c), #7fd0ff 75%) 50%, var(--c) 60%); background-size: 200% 100%;
              -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration-color: var(--c); animation: fxShine 2.6s linear infinite; }
  .fx-pulse { display: inline-block; animation: fxPulse 1.6s ease-in-out infinite; }
  .fx-hop { display: inline-block; animation: fxHop 2s ease-in-out infinite; }
  .fx-line { background-image: linear-gradient(#ffd84d, #ffd84d); background-repeat: no-repeat; background-position: left bottom; background-size: 0% .12em; animation: fxLine 2.4s ease-out infinite; }
  .wc { display: inline-block; animation: fxWave 1.6s ease-in-out infinite; animation-delay: calc(var(--i) * .08s); }
  /* 光るの中に、波・脈打つ・跳ねる（1つの塊で動くもの）が入ると光が届かず文字が消えるので、その部分は普通の色で見せる */
  .fx-shine .wc, .fx-shine .fx-pulse, .fx-shine .fx-hop, .fx-pulse.fx-shine, .fx-hop.fx-shine { color: var(--c); }
  .box.edit .t, .box.edit .t * { animation: none !important; }
  @keyframes fxShine { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
  @keyframes fxPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes fxHop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-.2em); } 90% { transform: translateY(0); } }
  @keyframes fxLine { 0% { background-size: 0% .12em; } 50%, 100% { background-size: 100% .12em; } }
  @keyframes fxWave { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-.18em); } }
</style>
</head>
<body>
<div id="board">
  <div id="side">
    <span class="lab">作る</span>
    <button id="add" class="main" title="文字ボックスを足す">＋ 文字を入れる</button>
    <button id="bgBtn" class="main" title="ボード全体の背景色">背景色</button>
    <span class="gap"></span>
    <span class="lab">残す</span>
    <button id="slotBtn" title="今のボードを保存する／保存したボードを読み込む（このパソコンのブラウザに残る）">保存・読込</button>
  </div>
  <div id="win">
    <button id="pin" title="ほかのアプリより常に手前の小窓に出す">最前面</button>
    <button id="reload" title="更新：ボードを読み直す（小窓の位置と大きさはそのまま）">↻</button>
  </div>
  <div id="slotPop" class="pop"></div>
  <div id="bgPop" class="pop">
    <div class="row"><span id="bgSw" style="display:flex;gap:4px"></span><input type="color" id="bgPick" title="ほかの色"></div>
    <div class="row" id="bgSt"><button data-st="">一色</button><button data-st="grad">グラデ</button><button data-st="flow">動くグラデ</button><button data-st="dot">ドット</button></div>
  </div>
  <div id="tb">
    <button id="minus" title="文字を小さく">−</button><span id="tbSize"></span><button id="plus" title="文字を大きく">＋</button>
    <span class="sep"></span>
    <button id="bold" title="太字／細字"><b>B</b></button><button id="und" title="下線"><u>U</u></button><button id="fxBtn" title="文字の動き（一部を選んでいればその部分だけ）">動き</button>
    <div id="fxRow"><button data-fx="shine">光る</button><button data-fx="pulse">脈打つ</button><button data-fx="hop">跳ねる</button><button data-fx="line">下線</button><button data-fx="wave">波</button><button data-fx="none">なし</button></div>
    <span class="sep"></span>
    <span id="fgSw" style="display:flex;gap:3px" title="文字の色"></span><input type="color" id="fgPick" title="ほかの色">
    <span class="sep"></span>
    <button id="dup" title="複製">⧉</button>
    <button id="del" title="消す（Deleteキーでも消せる）">🗑</button>
  </div>
  <div id="msg"></div>
</div>
<script>
(() => {
  const KEY = 'addness-live-board-v1';
  const SLOTS = 'addness-live-board-slots-v1';   // 保存①〜③
  const ADDNESS = '#141071';   // アドネスのロゴの紺（addness.com のアイコンから取った色）
  const BG = [ADDNESS, '#1a73e8', '#111111', '#ffffff', '#ffd400', '#e53935', '#2e7d32'];
  const FG = ['#ffffff', ADDNESS, '#111111', '#ffd400', '#e53935', '#1a73e8'];
  const IN_PIP = new URLSearchParams(location.search).has('pip');  // 小窓の中で読み込まれた時
  const $ = id => document.getElementById(id);
  const board = $('board'), side = $('side'), msg = $('msg');
  const bgPick = $('bgPick'), bgPop = $('bgPop'), fgPick = $('fgPick'), tb = $('tb'), tbSize = $('tbSize');
  const boldBtn = $('bold'), undBtn = $('und'), pinBtn = $('pin'), fxRow = $('fxRow');
  // ⌘Z 用の履歴：変えるたびにボード全体を文字にして積む。短い間の続けての変更（色を選び続ける等）は1つにまとめる
  let hist = [], hi = -1, lastRec = 0;
  let state = load();
  let sel = null;   // 選んでいるボックスの要素（まとめて選んでいる時は最後に選んだもの）
  let sels = [];    // まとめて選んでいるボックス全部（1つだけの時も入る）
  let pipWin = null;
  let onTb = false;  // 道具の上にマウスがあるか
  let editAt = 0;   // 書き換えに入った時刻（ダブルクリックの2打目で全選択が崩れないように使う）

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.boxes)) return s; } catch (e) {}
    return { bg: '#1a73e8', boxes: [{ id: 1, text: 'いまやっていること', x: 24, y: 24, size: 40, color: '#ffffff' }] };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} record(); }
  function record() {
    const s = JSON.stringify(state); if (s === hist[hi]) return;
    hist = hist.slice(0, hi + 1);
    const now = Date.now();
    if (hi > 0 && now - lastRec < 400) hist[hi] = s; else { hist.push(s); hi++; }
    if (hist.length > 100) { hist.shift(); hi--; }
    lastRec = now;
  }
  function restore(s) {
    state = JSON.parse(s); try { localStorage.setItem(KEY, s); } catch (e) {}
    board.querySelectorAll('.box').forEach(x => x.remove()); sel = null; sels = []; board.classList.remove('multi');
    applyBg(); state.boxes.forEach(render); placeTb();
  }
  function undo() { if (hi > 0) { hi--; lastRec = 0; restore(hist[hi]); } }
  function redo() { if (hi < hist.length - 1) { hi++; lastRec = 0; restore(hist[hi]); } }
  function find(el) { return state.boxes.find(b => String(b.id) === el.dataset.id); }
  function say(t) { msg.textContent = t; msg.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => msg.style.display = 'none', 4000); }

  // ---- 色の見本 ----
  function swatches(holder, list, pick, apply) {
    list.forEach(c => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = c; b.title = c === ADDNESS ? 'アドネスの色' : c; b.onclick = () => apply(c); holder.appendChild(b); });
    pick.oninput = () => apply(pick.value);
  }
  // 背景：選んだ色と、そこから明るさを変えた2色目・色味をずらした3色目で、グラデやドットを作る
  function hex2hsl(h) {
    h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join('');
    const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), L = (mx + mn) / 2; let H = 0, S = 0;
    if (mx !== mn) {
      const d = mx - mn; S = L > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      H = (mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) * 60;
    }
    return [H, S, L];
  }
  const hsl = (H, S, L) => `hsl(${Math.round(H)} ${Math.round(S * 100)}% ${Math.round(L * 100)}%)`;
  function applyBg() {
    const c = state.bg, [H, S, L] = hex2hsl(c), L2 = L > .65 ? L - .16 : Math.min(.68, L + .22);
    board.style.setProperty('--bg', c);
    board.style.setProperty('--bg2', hsl(H, S, L2));
    board.style.setProperty('--bg3', hsl(H + 40, S, L2));
    board.style.setProperty('--dot', L > .6 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.18)');
    board.classList.remove('st-grad', 'st-flow', 'st-dot');
    if (state.bgStyle) board.classList.add('st-' + state.bgStyle);
    bgPick.value = c;
    $('bgSt').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.st === (state.bgStyle || '')));
  }
  function setBg(c) { state.bg = c; applyBg(); save(); }
  $('bgSt').querySelectorAll('button').forEach(x => x.onclick = () => { state.bgStyle = x.dataset.st || null; applyBg(); save(); });
  function setFg(c) {
    fgPick.value = c;
    if (!sel) { state.fg = c; save(); return; }
    group().forEach(el => { const b = find(el); b.color = c; el.style.color = c; el.style.setProperty('--c', c); }); save();
  }
  swatches($('bgSw'), BG, bgPick, setBg);
  swatches($('fgSw'), FG, fgPick, setFg);
  // 背景ボタン：押すと左に色の見本が出る。もう一度押すか、ボードの何もない所を押すと閉じる
  const slotPop = $('slotPop');
  function closePops() { bgPop.classList.remove('on'); slotPop.classList.remove('on'); }
  function openPop(btn, pop) {
    const was = pop.classList.contains('on'); closePops();
    if (was) return;
    pop.classList.add('on');
    const r = btn.getBoundingClientRect(), br = board.getBoundingClientRect();
    pop.style.top = (r.top - br.top) + 'px';
    pop.style.left = Math.max(4, r.left - br.left - pop.offsetWidth - 6) + 'px';
  }
  $('bgBtn').onclick = () => openPop($('bgBtn'), bgPop);
  [bgPop, slotPop].forEach(p => p.addEventListener('pointerdown', e => e.stopPropagation()));

  // ---- 保存①〜③：今のボードをまるごと残し、あとで読み込む。このパソコンのブラウザにだけ残る ----
  function slots() { try { return JSON.parse(localStorage.getItem(SLOTS)) || {}; } catch (e) { return {}; } }
  function drawSlots() {
    const s = slots(); slotPop.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const row = document.createElement('div'); row.className = 'row';
      const name = document.createElement('b'); name.textContent = '①②③'[n - 1];
      const sv = document.createElement('button'); sv.textContent = '保存';
      const ld = document.createElement('button'); ld.textContent = '読込'; ld.disabled = !s[n];
      const lb = document.createElement('span'); lb.className = 'lb';
      lb.textContent = s[n] ? (s[n].label || '（文字なし）') : '空き';
      sv.onclick = () => {
        if (sel) stopEdit(sel);
        const all = slots(), first = state.boxes[0];

    pinBtn.onclick = async () => {
      if (pipWin) { pipWin.close(); return; }
      if (!('documentPictureInPicture' in window)) { say('この機能は Chrome か Edge（パソコン版）で使えます'); return; }
      if (sel) stopEdit(sel);
      try {
        pipWin = await documentPictureInPicture.requestWindow({ width: Math.max(320, board.offsetWidth >> 1), height: Math.max(180, board.offsetHeight >> 1) });
      } catch (e) { say('小窓を開けませんでした：' + e.message); return; }
      const d = pipWin.document;
      d.title = 'ライブ用ボード';
      const st = d.createElement('style');
      st.textContent = 'html,body{margin:0;height:100%;overflow:hidden;background:#222}iframe{display:block;border:0;width:100%;height:100%}';
      d.head.appendChild(st);
      const f = d.createElement('iframe');
      f.src = location.origin + location.pathname + '?pip=1&t=' + Date.now();
      d.body.appendChild(f);
      board.style.display = 'none'; showHome(true);
      pipWin.addEventListener('pagehide', () => {
        pipWin = null; board.style.display = ''; showHome(false);
        reloadState();   // 小窓の中で変えた分を読み直す
      });
    };
  }
  // 小窓に出ている間、元のタブには案内だけ出す
  const home = document.createElement('div');
  home.style.cssText = 'display:none;padding:24px;font-size:15px;line-height:1.8';
  home.innerHTML = 'ボードは最前面の小窓に出ています。<br>小窓を閉じるか「最前面を解除」を押すと、ここに戻ります。';
  document.body.appendChild(home);
  function showHome(on) { home.style.display = on ? 'block' : 'none'; }

  // ---- 起動 ----
  applyBg();
  state.boxes.forEach(render);
  record();
  fgPick.value = state.fg || '#ffffff';
})();
</script>
</body>
</html>
